# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 16 KB PAGE SIZE SUPPORT (wajib untuk Android 15+ / Google Play per 1 Nov 2025)
# ---------------------------------------------------------------------------
# Beberapa SDK Huawei (mis. Scan Kit -> ml-computer-sdkbase-inner yang berisi
# libml.so) masih membawa native library lama dengan LOAD segment alignment
# 4 KB, bukan 16 KB. Flag ini membuat AGP mengompresi ulang & me-realign
# .so di dalam APK menjadi 16 KB, sehingga warning
# "APK app-debug.apk is not compatible with 16 KB devices" hilang.
# Catatan: flag ini sudah default true pada AGP 8.5.1+, tetapi ditulis
# eksplisit agar jelas & aman bila build machine memakai AGP lebih lama.
android.enable16kbPageAlignment=true